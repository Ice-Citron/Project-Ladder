              translation: 0.0234
              roll: 0.0
              pitch: 0.0
              yaw: 0.0
          nic_rail_2:
            entity_present: False
          nic_rail_3:
            entity_present: True
            entity_name: "nic_card_3"
            entity_pose:
              translation: 0.0
              roll: 0.0
              pitch: 0.0
              yaw: 0.0
          nic_rail_4:
            entity_present: False
          sc_rail_0:
            entity_present: True
            entity_name: "sc_mount_0"
            entity_pose:
              translation: 0.042
              roll: 0.0
              pitch: 0.0
              yaw: 0.1
          sc_rail_1:
            entity_present: False
          lc_mount_rail_0:
            entity_present: True
            entity_name: "lc_mount_0"
            entity_pose:
              translation: 0.02
