# ec05 (was hc07) — NIC EASY-CONTROL, stock passed 93.19. Original design:
# What this config tries to do: put one blocker card on rail 3, at the rail
#   center, meant to sit under the arm's travel from home to the target card
#   on rail 1. Tests whether the certified SC snag class transfers to the
#   NIC task at all — here the free-hanging end is the SMALL SC connector,
#   not the big SFP cage that snagged in hc01-hc05.
# Expected stock failure: snag — the dangling SC end catches the blocker
#   card; weaker confidence than the SC cases, an EASY-CONTROL is possible.
# Task type: NIC (SFP plug into nic_card_mount_1); base = sample trial_2.
# Changed vs sample_config.yaml (trial_2 base):
#   nic_rail_1 translation: 0.036 -> 0.0234 (clamp into declared limits)
#   nic_rail_3.entity_present: False -> True ("nic_card_3", translation 0.0)
# Legal bounds check: 0.0234 at max of -0.0215..0.0234; 0.0 inside bounds


scoring:
  topics:
    - topic:
        name: "/joint_states"
        type: "sensor_msgs/msg/JointState"
    - topic:
        name: "/tf"
        type: "tf2_msgs/msg/TFMessage"
    - topic:
        name: "/tf_static"
        type: "tf2_msgs/msg/TFMessage"
        latched: true
    - topic:
        name: "/scoring/tf"
        type: "tf2_msgs/msg/TFMessage"
    - topic:
        name: "/aic/gazebo/contacts/off_limit"
        type: "ros_gz_interfaces/msg/Contacts"
    - topic:
        name: "/fts_broadcaster/wrench"
        type: "geometry_msgs/msg/WrenchStamped"
    - topic:
        name: "/aic_controller/joint_commands"
        type: "aic_control_interfaces/msg/JointMotionUpdate"
    - topic:
        name: "/aic_controller/pose_commands"
        type: "aic_control_interfaces/msg/MotionUpdate"
    - topic:
        name: "/scoring/insertion_event"
        type: "std_msgs/msg/String"
    - topic:
        name: "/aic_controller/controller_state"
        type: "aic_control_interfaces/msg/ControllerState"

task_board_limits:
  nic_rail:
    min_translation: -0.0215
    max_translation: 0.0234
  sc_rail:
    min_translation: -0.06
    max_translation: 0.055
  mount_rail:
    min_translation: -0.09425
    max_translation: 0.09425

