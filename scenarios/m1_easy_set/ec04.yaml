# ec04 — EASY. Was hc06 (NIC batch). Stock passed: 92.93 (2026-08-29).
# Scene: sample trial_2 (SFP insertion into nic_card_mount_1). Cards on
#   rails 0 and 2 stand beside the target card. All three sit at 0.0234.
# Why easy: the SFP port sits high on a tall card, above all obstacles.
#   The gripper cleared the slot between the neighbor cards.
# Changes vs sample_config.yaml trial_2:
#   nic_rail_1 (target): 0.036 -> 0.0234 (clamp into the limits)
#   nic_rail_0: absent -> "nic_card_0" at 0.0234
#   nic_rail_2: absent -> "nic_card_2" at 0.0234
# Bounds: 0.0234 is at the max of -0.0215..0.0234.

scoring:
  topics:
    - topic:
        name: "/joint_states"
        type: "sensor_msgs/msg/JointState"
    - topic:
        name: "/tf"
        type: "tf2_msgs/msg/TFMessage"
    - topic:
        name: "/tf_static"
        type: "tf2_msgs/msg/TFMessage"
        latched: true
    - topic:
        name: "/scoring/tf"
        type: "tf2_msgs/msg/TFMessage"
    - topic:
        name: "/aic/gazebo/contacts/off_limit"
        type: "ros_gz_interfaces/msg/Contacts"
    - topic:
        name: "/fts_broadcaster/wrench"
        type: "geometry_msgs/msg/WrenchStamped"
    - topic:
        name: "/aic_controller/joint_commands"
        type: "aic_control_interfaces/msg/JointMotionUpdate"
    - topic:
        name: "/aic_controller/pose_commands"
        type: "aic_control_interfaces/msg/MotionUpdate"
    - topic:
        name: "/scoring/insertion_event"
        type: "std_msgs/msg/String"
    - topic:
        name: "/aic_controller/controller_state"
        type: "aic_control_interfaces/msg/ControllerState"

