# hc06 — AXIS 7: target-position extreme — SC target at the FAR end of its rail.
# What this config tries to do: move the TARGET, not the obstacles. The SC
#   mount slides from -0.055 (sample) to +0.055 (max bound), 11 cm along the
#   rail. Two cards sit at the official nominal position (0.005, from
#   eval_config.yaml). Tests if the new plug-to-port diagonal finds these
#   previously-safe card positions on its own.
# Expected stock failure: snag on rail 1 or 2 — the shifted corridor should
#   cross near the card centers; open prediction, this tests if the per-rail
#   bad-band map generalizes across target positions.
# Changed vs sample_config.yaml (trial_3 base):
#   sc_rail_1 (sc_mount_1) translation: -0.055 -> 0.055 (at max bound)
#   nic_rail_1.entity_present: False -> True ("nic_card_1", translation 0.005)
#   nic_rail_2.entity_present: False -> True ("nic_card_2", translation 0.005)
# Legal bounds check: sc_rail 0.055 at max of -0.06..0.055; nic 0.005 inside
#   -0.0215..0.0234. The engine clamps translations anyway (aic_engine.cpp:1825).
# NOTE: verify visually that the port now sits at the other end of its rail
#   and that the descent diagonal passes over or between the two cards.

scoring:
  topics:
    - topic:
        name: "/joint_states"
        type: "sensor_msgs/msg/JointState"
    - topic:
        name: "/tf"
        type: "tf2_msgs/msg/TFMessage"
    - topic:
        name: "/tf_static"
        type: "tf2_msgs/msg/TFMessage"
        latched: true
    - topic:
        name: "/scoring/tf"
        type: "tf2_msgs/msg/TFMessage"
    - topic:
        name: "/aic/gazebo/contacts/off_limit"
        type: "ros_gz_interfaces/msg/Contacts"
    - topic:
        name: "/fts_broadcaster/wrench"
        type: "geometry_msgs/msg/WrenchStamped"
    - topic:
        name: "/aic_controller/joint_commands"
        type: "aic_control_interfaces/msg/JointMotionUpdate"
    - topic:
        name: "/aic_controller/pose_commands"
        type: "aic_control_interfaces/msg/MotionUpdate"
    - topic:
        name: "/scoring/insertion_event"
        type: "std_msgs/msg/String"
    - topic:
        name: "/aic_controller/controller_state"
        type: "aic_control_interfaces/msg/ControllerState"

task_board_limits:
  nic_rail:
    min_translation: -0.0215
    max_translation: 0.0234
  sc_rail:
    min_translation: -0.06
    max_translation: 0.055
  mount_rail:
    min_translation: -0.09425
    max_translation: 0.09425

trials:
  trial_1:
    scene:
        task_board:
          pose:
            x: 0.17
            y: 0.0
            z: 1.14
            roll: 0.0
            pitch: 0.0
            yaw: 3.0
          nic_rail_0:
            entity_present: False
          nic_rail_1:
            entity_present: True
            entity_name: "nic_card_1"
            entity_pose:
              translation: 0.005
              roll: 0.0
              pitch: 0.0
              yaw: 0.0
          nic_rail_2:
            entity_present: True
            entity_name: "nic_card_2"
            entity_pose:
              translation: 0.005
              roll: 0.0
              pitch: 0.0
              yaw: 0.0
          nic_rail_3:
            entity_present: False
          nic_rail_4:
            entity_present: False
          sc_rail_0:
            entity_present: False
          sc_rail_1:
            entity_present: True
            entity_name: "sc_mount_1"
            entity_pose:
              translation: 0.055
              roll: 0.0
              pitch: 0.0
              yaw: 0.0
          lc_mount_rail_0:
            entity_present: False
          sfp_mount_rail_0:
            entity_present: True
            entity_name: "sfp_mount_0"
            entity_pose:
              translation: 0.05
              roll: 0.0
              pitch: 0.0
              yaw: 0.0
          sc_mount_rail_0:
            entity_present: True
            entity_name: "sc_mount_2"
            entity_pose:
              translation: -0.03
              roll: 0.0
              pitch: 0.0
              yaw: 0.0
          lc_mount_rail_1:
            entity_present: True
            entity_name: "lc_mount_1"
            entity_pose:
              translation: 0.04
              roll: 0.0
              pitch: 0.0
              yaw: 0.0
          sfp_mount_rail_1:
            entity_present: False
          sc_mount_rail_1:
            entity_present: False
        cables:
          cable_1:
            pose:
              gripper_offset:
                x: 0.0
                y: 0.015385
                z: 0.04045
              roll: 0.4432
              pitch: -0.4838
              yaw: 1.3303
            attach_cable_to_gripper: True
            cable_type: "sfp_sc_cable_reversed"
    tasks:
      task_1:
        cable_type: "sfp_sc"
        cable_name: "cable_1"
        plug_type: "sc"
        plug_name: "sc_tip"
        port_type: "sc"
        port_name: "sc_port_base"
        target_module_name: "sc_port_1"
        time_limit: 180

robot:
  home_joint_positions:
    shoulder_pan_joint: -0.1597
    shoulder_lift_joint: -1.3542
    elbow_joint: -1.6648
    wrist_1_joint: -1.6933
    wrist_2_joint: 1.5710
    wrist_3_joint: 1.4110
