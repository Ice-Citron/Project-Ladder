# hc09 — AXIS 10: board rotation — the ORGANIZERS' own rotated SC scene.
# What this config is: eval_config.yaml trial_3, verbatim, as one trial.
#   Board at (0.2, -0.15), yaw -1.8 — about 77 deg away from the sample
#   orientation — with three cards at 0.005 (rails 0,1,2) and the SC target
#   on sc_rail_1 at -0.04. This is the scored evaluation's own SC scene.
# Rotation-bounds verification (per coordinator, by source not memory):
#   the engine checks only that pose keys EXIST, no range check
#   (aic_engine.cpp:62-68); rail translations are clamped to limits at spawn
#   (aic_engine.cpp:1825); board yaw across official configs: 3.0, 3.1415
#   (sample_config.yaml), 3.1, -3.1, -1.8 (eval_config.yaml:66,160,260).
#   So yaw -1.8 is INSIDE the scored distribution — the "±10 deg" memory is
#   wrong. Rotation gets this one config only: GT hands stock the full port
#   pose, so rotation must work through cable drape and approach geometry.
# Expected stock failure: snag on one of the three cards from the rotated
#   approach; open prediction — a pass means the official scene family is
#   easy for stock under GT, which is also a citable result.
# Changed vs eval_config.yaml (trial_3): nothing — single-trial extraction.
# Legal bounds check: by construction (organizer-authored values).
# NOTE: verify visually that the board stands visibly rotated versus every
#   previous run, and watch which card the cable meets first.

scoring:
  topics:
    - topic:
        name: "/joint_states"
        type: "sensor_msgs/msg/JointState"
    - topic:
        name: "/tf"
        type: "tf2_msgs/msg/TFMessage"
    - topic:
        name: "/tf_static"
        type: "tf2_msgs/msg/TFMessage"
        latched: true
    - topic:
        name: "/scoring/tf"
        type: "tf2_msgs/msg/TFMessage"
    - topic:
        name: "/aic/gazebo/contacts/off_limit"
        type: "ros_gz_interfaces/msg/Contacts"
    - topic:
        name: "/fts_broadcaster/wrench"
        type: "geometry_msgs/msg/WrenchStamped"
    - topic:
        name: "/aic_controller/joint_commands"
        type: "aic_control_interfaces/msg/JointMotionUpdate"
    - topic:
        name: "/aic_controller/pose_commands"
        type: "aic_control_interfaces/msg/MotionUpdate"
    - topic:
        name: "/scoring/insertion_event"
        type: "std_msgs/msg/String"
    - topic:
        name: "/aic_controller/controller_state"
        type: "aic_control_interfaces/msg/ControllerState"

